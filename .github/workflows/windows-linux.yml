# Windows and Linux builds of Stitchup on GitHub's own machines.
# Manual only: Actions ▸ "Windows & Linux builds" ▸ Run workflow.
# Installers are attached to the run as downloadable artifacts.
name: Windows & Linux builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fonts-dejavu fonts-noto-core

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: PDF engine tests
        working-directory: source/core
        run: cargo test --release

      - name: Install frontend
        working-directory: source/app
        run: npm ci

      - name: Build installers
        working-directory: source/app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Portable Windows zip (no installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content source/app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "portable/Stitchup"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item source/app/src-tauri/target/release/stitchup.exe "$dir/Stitchup.exe"
          @"
          Stitchup $v - portable (no installer)

          EXPERIMENTAL - USE AT YOUR OWN RISK. Keep backups of important documents.

          Unzip anywhere and run Stitchup.exe. Needs the Microsoft Edge WebView2
          Runtime, which Windows 10 and 11 already include. Windows SmartScreen may
          warn the first time (the app is not code-signed): More info > Run anyway.

          Settings, saved signatures and recent files are kept in your Windows user
          profile (%APPDATA% / %LOCALAPPDATA%), like any app. OCR is macOS-only.
          "@ | Set-Content "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "source/app/src-tauri/target/release/bundle/Stitchup-windows-portable-x64-v$v.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: stitchup-${{ runner.os }}
          path: |
            source/app/src-tauri/target/release/bundle/nsis/*.exe
            source/app/src-tauri/target/release/bundle/msi/*.msi
            source/app/src-tauri/target/release/bundle/*.zip
            source/app/src-tauri/target/release/bundle/deb/*.deb
            source/app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
