# Android test build of Stitchup (tablet-first), on GitHub's machines.
# Manual only: Actions ▸ "Android build" ▸ Run workflow.
# The signed APK is attached to the run as a downloadable artifact.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_B64 (base64 of a
# PKCS#12 keystore, alias "stitchup") and ANDROID_KEYSTORE_PASSWORD every
# build has the same signature, so a new APK installs over the old one.
# Without them a throwaway key is made per build (uninstall before updating).
name: Android build

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -1 | sed "s|^|BUILD_TOOLS=$ANDROID_HOME/build-tools/|" >> "$GITHUB_ENV"

      - name: PDF engine tests
        working-directory: source/core
        run: cargo test --release

      - name: Install frontend
        working-directory: source/app
        run: npm ci

      - name: Android project
        working-directory: source/app
        run: npx tauri android init --ci

      - name: Build APK (ARM64 tablets/phones + x86_64 Chromebooks/emulators)
        working-directory: source/app
        run: npx tauri android build --apk --target aarch64 --target x86_64

      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          v=$(jq -r .version source/app/src-tauri/tauri.conf.json)
          apk=$(find source/app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "unsigned: $apk"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ks.p12
          else
            echo "::warning::No signing secrets: using a throwaway key (uninstall the previous test build first)"
            KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ks.p12 -storetype PKCS12 -alias stitchup -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Stitchup test build"
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" aligned.apk
          mkdir -p out
          KS_PASS="$KS_PASS" "$BUILD_TOOLS/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS \
            --out "out/Stitchup-android-v$v.apk" aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "out/Stitchup-android-v$v.apk" | head -3
          rm -f ks.p12

      - uses: actions/upload-artifact@v4
        with:
          name: stitchup-Android
          path: out/*.apk
          if-no-files-found: error
